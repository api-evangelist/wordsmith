aid: wordsmith
name: Wordsmith
description: >-
  Wordsmith is an Edinburgh-based legal AI platform built for in-house legal
  teams, marketed as a Slack-native legal copilot that lets non-legal staff
  self-serve compliant answers, templates, and contract reviews directly in
  the tools they already use. The product line includes the Wordsmith
  Assistant (a chat surface that answers routine legal questions, summarises
  documents, and runs contract review against organisation-specific
  Playbooks), Templates (parameterised DOCX/Markdown document generation
  with placeholder fields and fallback clause logic), Playbooks (codified
  review rules used to flag non-standard terms in NDAs, MSAs, DPAs and
  similar agreements and to propose pre-approved compromise positions), and
  a growing set of channel integrations centred on Slack, Microsoft Teams,
  Gmail, Outlook, Microsoft Word, Google Docs/Drive, SharePoint, OneDrive,
  Notion, Confluence, Dropbox, Salesforce, HubSpot, Attio, Ironclad, Juro,
  Asana, Monday.com, Jira, Linear, Granola, Google Sheets, and Excel, plus
  programmatic reach via an MCP server, Zapier, and n8n. Wordsmith exposes
  a public REST API documented at wordsmithai.mintlify.app with Bearer-token
  authentication and resources for Assistants (ask a question with optional
  file attachments, poll question status, list assistants available to the
  account), Files (presigned upload URLs for documents), Playbooks (list
  accessible review playbooks), Templates (list accessible templates), User
  (get-me for the authenticated user and organisation), plus signed
  Webhooks for asynchronous notifications. The company was founded in
  October 2023 by Ross McNairn (CEO, formerly Head of Product at
  Skyscanner and CPTO at TravelPerk), Robbie Falkenthal (COO), and
  Volodymyr Giginyak (CTO), is headquartered in Edinburgh with offices in
  London and New York, raised a $25M Series A from Index Ventures in
  June 2025 at a reported $100M valuation, and counts Trustpilot,
  Skyscanner, AutoTrader, Deliveroo, BT, Trip.com, Coursera, Canva,
  The Financial Times, Remote.com, Multiverse, and Docplanner among its
  customers. Pricing is published as an Individual plan at $450 per user
  per month and a custom Enterprise plan, with a 30-minute book-a-demo
  flow as the primary onboarding path. WORDSMITH is a registered trade
  mark of Wordsmith Law LLP and is used under licence by Wordsmith AI.
