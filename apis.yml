apis:
  - aid: wordsmith:platform-api
    name: Wordsmith Platform API
    description: >-
      Public REST API for the Wordsmith legal AI platform. Lets developers
      ask questions of Wordsmith Assistants with optional file attachments,
      poll question status, list available assistants, generate presigned
      file upload URLs, list Playbooks and Templates accessible to the
      caller, retrieve information about the authenticated user and their
      organisation, and receive signed Webhook notifications when
      long-running operations complete. Uses Bearer-token authentication
      with API keys of the form `sk-ws-api1-...` and is served from
      `https://api.wordsmith.ai/api/v1/`.
    type: REST
    tags:
      - Legal AI
      - Assistants
      - Playbooks
      - Templates
      - Files
      - Webhooks
    humanURL: https://wordsmithai.mintlify.app/
    baseURL: https://api.wordsmith.ai/api/v1
    properties:
      - type: Documentation
        url: https://wordsmithai.mintlify.app/
      - type: GettingStarted
        url: https://wordsmithai.mintlify.app/quickstart
      - type: Authentication
        url: https://wordsmithai.mintlify.app/authentication
      - type: Introduction
        url: https://wordsmithai.mintlify.app/introduction
      - type: ErrorCodes
        url: https://wordsmithai.mintlify.app/errors
      - type: Webhooks
        url: https://wordsmithai.mintlify.app/webhooks
      - type: APIReference
        url: https://wordsmithai.mintlify.app/api-reference/user/get-me
      - type: LLMs
        url: https://wordsmithai.mintlify.app/llms.txt
  - aid: wordsmith:mcp-server
    name: Wordsmith MCP Server
    description: >-
      Model Context Protocol server that exposes Wordsmith Assistants,
      Playbooks, and Templates to MCP-aware clients (Claude, agent
      frameworks, IDEs) so legal context can be pulled into AI workflows
      without bespoke integration code. Marketed as the connective tissue
      between Wordsmith and the wider AI ecosystem.
    type: MCP
    tags:
      - MCP
      - Model Context Protocol
      - AI Agents
      - Legal AI
    humanURL: https://www.wordsmith.ai/integrations/mcp
    properties:
      - type: Documentation
        url: https://www.wordsmith.ai/integrations/mcp
